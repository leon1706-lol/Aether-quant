# V6.6.5 (#348): production secrets as Docker secrets instead of environment variables.
#
#   mkdir secrets            # gitignored and dockerignored
#   # write secrets/postgres_password and secrets/postgres_dsn (one line each, no quotes)
#   docker compose -f docker-compose.yml -f docker-compose.secrets.yml up -d
#
# Every service reads secrets through execution/secrets_io.py, where /run/secrets/aether_<name> wins over the
# AETHER_<NAME> variable, so the published dev password in docker-compose.yml is never used once this override is on.
# Postgres reads POSTGRES_PASSWORD_FILE (the official image refuses both forms at once, hence the blank variable).
# RUNBOOK "Secrets" covers rotation and the keyring for a host without Docker.

secrets:
  aether_postgres_password:
    file: ./secrets/postgres_password
  aether_postgres_dsn:
    file: ./secrets/postgres_dsn

services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ""
      POSTGRES_PASSWORD_FILE: /run/secrets/aether_postgres_password
    secrets:
      - aether_postgres_password

  engine:
    secrets:
      - aether_postgres_dsn

  experience-worker:
    secrets:
      - aether_postgres_dsn

  audit-worker:
    secrets:
      - aether_postgres_dsn

  performance-trigger-worker:
    secrets:
      - aether_postgres_dsn

  telegram-worker:
    secrets:
      - aether_postgres_dsn

  retraining-worker:
    secrets:
      - aether_postgres_dsn
