[build-system]
requires = ["setuptools>=61.0", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "aether-quant"
dynamic = ["version"]
description = "Aether Quant convenience CLI"
readme = "README.md"
license = "LicenseRef-PolyForm-Noncommercial-1.0.0"
requires-python = ">=3.10"
authors = [
    { name = "leon1706-lol" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Office/Business :: Financial :: Investment",
]
keywords = ["algorithmic-trading", "quantitative-finance", "pytorch", "quantconnect"]

[project.urls]
Homepage = "https://github.com/leon1706-lol/Aether-quant"
Repository = "https://github.com/leon1706-lol/Aether-quant"
Changelog = "https://github.com/leon1706-lol/Aether-quant/blob/main/development/Changelog.md"

# Version comes from the git tag that triggered the release (e.g. v2.2.0 ->
# 2.2.0) - no manual version bump anywhere in this repo. Falls back to a
# 0.0.dev<N>+g<hash>-style version for untagged/local dev installs (e.g.
# `pip install -e .` without ever having tagged), so the existing local `aq`
# CLI workflow is unaffected.
[tool.setuptools_scm]

[project.scripts]
aq = "aq_cli:main"

[tool.setuptools]
# Explicit, not auto-discovered: backtests/*/code/ contains full copies of
# this repo's packages (each backtest run snapshots the algorithm code), so
# unrestricted package discovery from repo root would pick up duplicates.
# List only what aq_cli.py actually imports directly (including
# transitively) - extend this list if a future aq subcommand needs another
# first-party module/package imported in-process rather than invoked via
# subprocess. `execution` was added after `risk/manual_override.py` gained
# a `from execution.config_cache import read_cached` import - a real
# regression this exact comment exists to prevent from recurring (the
# installed `aq` command failed with `ModuleNotFoundError: No module named
# 'execution'` until this was added, even though `python -m pytest`/the
# Lean container both masked it by putting the repo root on sys.path
# directly). `data_pipeline` was added the same way, after `aq_cli.py`
# gained `from data_pipeline.fetch import ...` for the `aq fetch` command.
# V5.4.4: `evaluation`/`portfolio`/`features`/`audit`/`inference`/
# `analyzer` added after the installed `aq` console script was found
# raising `ModuleNotFoundError: No module named 'evaluation'` on
# `aq evaluate` - aq_cli.py has imported these in-process (function-level,
# so pytest and the Lean container masked it the same way as the
# `execution` case above) since long before this round; transitively:
# `evaluation` -> `portfolio` (rank_book_simulator),
# `inference` (model_predictions), `analyzer` (confidence_threshold_
# calibration -> market_analyzer).
py-modules = ["aq_cli", "generate_backtest_report", "generate_evaluation_report", "json_safety"]
packages = ["risk", "execution", "data_pipeline", "evaluation", "portfolio", "features", "audit", "inference", "analyzer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Bare `pytest` (not `python -m pytest`) never gets the repo root on
# sys.path on its own - it was only ever working locally because everyone
# invoked it as `python -m pytest`, which Python itself prepends the CWD for.
# pytest's own `pythonpath` option makes this work identically regardless of
# how pytest is invoked (bare console script, python -m, any OS, CI).
pythonpath = ["."]
markers = [
    "lean_backtest: real `lean backtest .` integration test (over an hour wall-clock) - excluded from `aq test`'s default run, included via `aq test --lean`/`--full`.",
]

# V5.3.9 - Python lint job in ci.yml. Deliberately narrow rule set (E/F =
# pycodestyle errors + pyflakes) calibrated to the EXISTING codebase style
# so CI hardens without a mass style migration:
# - line-length 240 matches the documented long-line convention of
#   main.py/aq_cli.py/train.py
# - main.py is exempt from E501/F403/F405: Lean's AlgorithmImports star-
#   import pattern makes those structural (see #16/#69 lineage)
# - __init__.py files are exempt from F401: package re-export convention
[tool.ruff]
line-length = 240
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F"]

[tool.ruff.lint.per-file-ignores]
"webui/**" = ["E", "F"]
"main.py" = ["E501", "F403", "F405"]
"**/__init__.py" = ["F401"]
"scripts/profile_inference.py" = ["E501"]

# V5.3.9 - coverage configuration for the ci.yml fail-under gate.
[tool.coverage.run]
source = [
    "aq_cli",
    "analyzer",
    "audit",
    "data_pipeline",
    "evaluation",
    "execution",
    "experience",
    "experts",
    "features",
    "inference",
    "liquidity",
    "monitoring",
    "moe",
    "notifications",
    "performance",
    "portfolio",
    "regime",
    "retraining",
    "risk",
    "storage",
    "topology",
    "risk_controls",
    "train_multitask",
    "train_sequence",
    "train_gating",
]
omit = [
    "*/tests/*",
    "tests/*",
    "scripts/*",
    "webui/*",
    "*/__main__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
