[build-system]
requires = ["setuptools>=77.0", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "aether-quant"
dynamic = ["version"]
description = "Aether Quant: a self-adapting trading research system, its library and the aq CLI"
readme = "README.md"
# V6.6.5 (#347): what the wheel ships is the library, Apache-2.0; the trading system in the repo is AGPL-3.0 (LICENSE, LICENSING.md, REUSE.toml)
license = "Apache-2.0"
license-files = ["LICENSES/Apache-2.0.txt", "NOTICE"]
requires-python = ">=3.10"
# V6.6.5 (#342): a bare `pip install aether-quant` is the research-only install: numpy and pandas, no torch, no Lean, no
# Docker. tests/test_lite_install.py imports every facade and runs `aq hello --offline` with everything else blocked.
dependencies = ["numpy>=1.24", "pandas>=2.0"]
authors = [
    { name = "leon1706-lol" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Office/Business :: Financial :: Investment",
]
keywords = ["algorithmic-trading", "quantitative-finance", "backtesting", "overfitting", "deflated-sharpe", "pytorch", "quantconnect"]

[project.urls]
Homepage = "https://github.com/leon1706-lol/Aether-quant"
Repository = "https://github.com/leon1706-lol/Aether-quant"
Changelog = "https://github.com/leon1706-lol/Aether-quant/blob/main/development/Changelog.md"
Documentation = "https://leon1706-lol.github.io/Aether-quant/"

# Version comes from the git tag that triggered the release (e.g. v2.2.0 ->
# 2.2.0) - no manual version bump anywhere in this repo. Falls back to a
# 0.0.dev<N>+g<hash>-style version for untagged/local dev installs (e.g.
# `pip install -e .` without ever having tagged), so the existing local `aq`
# CLI workflow is unaffected.
[tool.setuptools_scm]

[project.scripts]
aq = "aq_cli:main"

[project.optional-dependencies]
lib = []
research = ["pyarrow>=23.0.1", "scipy", "scikit-learn", "statsmodels", "httpx[http2]>=0.27.0"]
notebooks = ["aether-quant[research]", "matplotlib", "ipykernel", "nbclient", "nbformat"]
dashboard = ["fastapi>=0.110.0", "uvicorn>=0.29.0"]
live = ["redis>=5.0.0", "psycopg[binary]>=3.3.8", "keyring", "ibapi>=9.81", "lean>=1.0.225"]
train = ["pyarrow>=23.0.1", "scikit-learn", "joblib>=1.6.0", "torch>=2.15.0"]
docs = ["mkdocs-material", "mkdocstrings[python]", "mkdocs-jupyter"]
full = [
    "aether-quant[research,dashboard,live,train]", "flask>=3.1.3", "aiofiles>=23.0", "python-dotenv>=1.2.2", "pyyaml>=6.0",
    "requests>=2.33.0", "aether-vault==1.7.1",
]

[tool.setuptools]
# Explicit, not auto-discovered: backtests/*/code/ contains full copies of
# this repo's packages (each backtest run snapshots the algorithm code), so
# unrestricted package discovery from repo root would pick up duplicates.
# List only what aq_cli.py actually imports directly (including
# transitively) - extend this list if a future aq subcommand needs another
# first-party module/package imported in-process rather than invoked via
# subprocess. `execution` was added after `risk/manual_override.py` gained
# a `from execution.config_cache import read_cached` import - a real
# regression this exact comment exists to prevent from recurring (the
# installed `aq` command failed with `ModuleNotFoundError: No module named
# 'execution'` until this was added, even though `python -m pytest`/the
# Lean container both masked it by putting the repo root on sys.path
# directly). `data_pipeline` was added the same way, after `aq_cli.py`
# gained `from data_pipeline.fetch import ...` for the `aq fetch` command.
# V5.4.4: `evaluation`/`portfolio`/`features`/`audit`/`inference`/
# `analyzer` added after the installed `aq` console script was found
# raising `ModuleNotFoundError: No module named 'evaluation'` on
# `aq evaluate` - aq_cli.py has imported these in-process (function-level,
# so pytest and the Lean container masked it the same way as the
# `execution` case above) since long before this round; transitively:
# `evaluation` -> `portfolio` (rank_book_simulator),
# `inference` (model_predictions), `analyzer` (confidence_threshold_
# calibration -> market_analyzer).
# V5.5.0: `monitoring` (aq assets), `topology` (aq evaluate
# --calibrate-volatility-threshold), `liquidity`
# (evaluation/feature_parity.py) and `experience`
# (execution/paper_readiness_report.py) added - the same
# ModuleNotFoundError-on-a-real-wheel class, found by
# tests/test_packaging_modules.py, which now fails any shipped file that
# imports a first-party module this list omits. `performance_probe`
# ships because main.py and the wheel-smoke job both import it, and
# `risk_controls` because evaluation/kill_switch_replay.py imports it (found
# by scripts/wheel_smoke.py against a real built wheel - `aq evaluate
# --replay-kill-switch` raised ModuleNotFoundError for wheel users).
py-modules = ["aq_cli", "docs_facts", "generate_backtest_report", "generate_evaluation_report", "json_safety", "performance_probe", "risk_controls"]
# V6.4.3: `aether_quant` - the library facade (re-exports of the pure modules above, research tools, formal cases).
# V6.6.1: the library covers every subsystem, so these ship too.
packages = ["risk", "execution", "data_pipeline", "evaluation", "portfolio", "features", "audit", "inference", "analyzer", "monitoring", "topology", "liquidity", "experience", "aether_quant", "moe", "regime", "retraining", "notifications", "experts", "performance"]

[tool.setuptools.package-data]
aether_quant = ["py.typed", "README.md", "_formal_cases/*.json", "_sample/*", "_templates/project/*", "_templates/project/tests/*.tmpl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Bare `pytest` (not `python -m pytest`) never gets the repo root on
# sys.path on its own - it was only ever working locally because everyone
# invoked it as `python -m pytest`, which Python itself prepends the CWD for.
# pytest's own `pythonpath` option makes this work identically regardless of
# how pytest is invoked (bare console script, python -m, any OS, CI).
pythonpath = ["."]
markers = [
    "lean_backtest: real `lean backtest .` integration test (over an hour wall-clock) - excluded from `aq test`'s default run, included via `aq test --lean`/`--full`.",
]

# V6.6.8 (#379): `ruff check .` (CI python-lint) runs the rule sets in `select`. Every exclusion below carries its reason
# on the line above it, and tests/test_ruff_config.py pins both. line-length 240 is the house long-line convention;
# target-version matches requires-python (3.10), so no fix reaches for a 3.11-only name (#326).
[tool.ruff]
line-length = 240
target-version = "py310"
# the root's packages and modules are first-party, and so are the tests' helpers (lean_fakes, train_world, ...), which the
# tests import from tests/; import sorting then reads the same on every machine
src = [".", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "PLE", "PIE", "SIM", "PERF", "N", "UP", "PLW", "C4", "I", "B", "RUF"]
ignore = [
    # try/except/pass is cheaper than contextlib.suppress on the per-bar path (AGENTS rule 11) and reads as clearly
    "SIM105",
    # an if/else block keeps two long branches readable; a ternary is used where the whole choice fits one short line
    "SIM108",
    # try/except costs nothing until it raises on the interpreters this runs on (3.11+), and one bad item must not stop the loop
    "PERF203",
    # an explicit append loop is kept where it filters or names a step; the gain of a comprehension is negligible here
    "PERF401",
    # control-flow exceptions (NetworkOutage, NoSessionToRecord, MissingInput, Stop) name a condition, not an error, and are imported across the repo
    "N818",
    # rebinding a loop variable to its cleaned form (line.strip(), batch.to(device), frame.copy()) is the idiom; a second name adds nothing
    "PLW2901",
    # dict(key=value) keyword calls are the house style for config and payload literals
    "C408",
    # int(round(x)) stays: round() of a numpy scalar returns a numpy float, not an int
    "RUF046",
    # a + [b] stays: an operand can be a numpy array or a pandas index, where [*a, b] would change the type
    "RUF005",
    # __all__ is grouped by job (the facades document their names that way), not sorted
    "RUF022",
]
# typographic signs in prose and report text (multiplication, minus, the information mark) are intentional
allowed-confusables = ["×", "−", "ℹ"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's parameter markers are declarations read once at import, not mutable defaults
extend-immutable-calls = ["fastapi.Body", "fastapi.Depends", "fastapi.Header", "fastapi.Path", "fastapi.Query"]

[tool.ruff.lint.per-file-ignores]
# the dashboard is TypeScript; nothing Python lives there
"webui/**" = ["E", "F"]
# V6.6.5: tutorials import where a step first needs a module, and their markdown cells are prose; a cell's last expression is what it displays (B018); the install cell keeps the `noqa: F821` its notebooks/src twin needs, and a notebook must match its source cell for cell (RUF100)
"notebooks/**" = ["E402", "E501", "B018", "RUF100"]
# Lean's AlgorithmImports star import is structural (#16, #69) and must precede the builtins/time re-imports (AGENTS rule 10), so imports are never re-sorted here; Lean's .NET fee and slippage models call GetOrderFee/GetSlippageApproximation
"main.py" = ["E501", "F403", "F405", "N802", "I001"]
# a package's __init__ re-exports its modules' names
"**/__init__.py" = ["F401"]
# the profiler prints whole timing tables on one line
"scripts/profile_inference.py" = ["E501"]
# matrix and panel names follow the maths (X, XtX, R, T)
"evaluation/factor_neutralization_check.py" = ["N806"]
# matrix and panel names follow the maths (R, T, T_work), and ERA_RANGES is a constant table
"scripts/promotion_gate_null_*.py" = ["N806"]
# a ProcessPoolExecutor initializer can only hand each worker its model exports through module state
"inference/parallel_inference.py" = ["PLW0603"]
# a past round's record: its --smoke mode shrinks the module's phase count in place
"scripts/v640_research.py" = ["PLW0603"]
# V6.6.6: the runtime tests write whole scenarios on one line, and a test module imports a sibling's fixtures by name (pytest takes them from the argument list); the fakes mirror Lean's .NET and ib_insync names (N802, N803), constants local to a test are capitalised (N806), a lambda around a call reads a monkeypatched name at call time (PLW0108), and where the driver or the environment decides the exception type a test asserts only that one is raised (B017), and a match= pattern is a regex by pytest's contract, matching its message as written (RUF043)
"tests/**" = ["E501", "F811", "N802", "N803", "N806", "PLW0108", "B017", "RUF043"]

# V6.6.6 (#359): every tracked Python file outside tests/ is measured, at 100%, with no pragma. `if TYPE_CHECKING:` blocks
# (imports for annotations only, never executed) are the one exclusion. tests/test_coverage_scope.py pins all of it.
[tool.coverage.run]
# V6.6.10: every coverage output (data, json, xml, html, the JUnit report) lives in coverage-report/, not the repo root
data_file = "coverage-report/.coverage"
# every directory holding tracked code: unlike `source`, a directory here is searched for files no test imports even
# without an __init__.py (scripts/, examples/, notebooks/src/)
source_dirs = [
    ".",
    "aether_quant",
    "analyzer",
    "audit",
    "cpp_inference_ext",
    "data_pipeline",
    "evaluation",
    "examples",
    "execution",
    "experience",
    "experts",
    "features",
    "fuzz",
    "inference",
    "liquidity",
    "moe",
    "monitoring",
    "notebooks/src",
    "notifications",
    "performance",
    "portfolio",
    "regime",
    "retraining",
    "risk",
    "scripts",
    "scripts/lean_smoke",
    "scripts/lean_teardown_smoke",
    "topology",
]
# a script a test runs as a subprocess is measured too (coverage >= 7.10)
patch = ["subprocess"]
omit = [
    "tests/*",
    "backtests/*",
    "backtests_invalid/*",
    "build/*",
    "site/*",
    "webui/*",
    ".venv/*",
    "venv/*",
    "data/*",
    "data_backups/*",
    "data_crypto_wide/*",
    "data_pre2013/*",
    "data_wide/*",
    "formal/.lake/*",
    "ml/*",
    "aether_quant.egg-info/*",
    "Aether-quant-Obsidian-Vault/*",
]

[tool.coverage.report]
fail_under = 100
exclude_lines = ["if TYPE_CHECKING:"]

[tool.coverage.json]
output = "coverage-report/coverage.json"

[tool.coverage.xml]
output = "coverage-report/coverage.xml"

[tool.coverage.html]
directory = "coverage-report/htmlcov"
