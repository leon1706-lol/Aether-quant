title = "Aether Quant gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Two line shapes that are not credentials but read as one. Exported-model JSON names its tensors in `weight_key` / `bias_key` fields (e.g. \"head_rank_5d.weight\"), which the generic-api-key rule reads as a key. A pip hash line in requirements/lock/ (`--hash=sha256:` and 64 hex digits) is a file digest, and the case-insensitive square-access-token rule matches the few that start with `eaaa`."
regexTarget = "line"
regexes = [
    '''"(weight|bias)_key"\s*:\s*"[A-Za-z0-9_.]+"''',
    '''--hash=sha256:[0-9a-f]{64}''',
]
