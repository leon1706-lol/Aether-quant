name: Pipeline

# aq init's workflow: the signal's tests and the whole pipeline on every push and every Monday, on GitHub's free runners.
# The report is this run's artifact. Actions are pinned by commit, as OpenSSF Scorecard asks.
on:
  push:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install aether-quant
        run: python -m pip install "aether-quant=={{version}}" pytest

      - name: The signal's checks
        run: pytest -q

      - name: Data, signal, evaluate, gate, report
        run: aq pipeline run --run-id ci-${{ github.run_id }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: pipeline-report
          path: runs/
