site_name: Aether Quant
site_description: A research toolkit for systematic trading, and the self-adapting trading system built on it
site_url: https://leon1706-lol.github.io/Aether-quant/
repo_url: https://github.com/leon1706-lol/Aether-quant
repo_name: leon1706-lol/Aether-quant
edit_uri: edit/main/docs/
docs_dir: docs
strict: true

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      toggle:
        icon: material/weather-sunny
        name: Light mode

plugins:
  - search
  - mkdocs-jupyter:
      execute: false
      include_source: true
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            # the facades re-export these packages' objects: load them so every alias resolves to its documented target
            preload_modules: [risk, portfolio, execution, evaluation, features, data_pipeline, audit, inference, analyzer, monitoring, topology, liquidity, experience, moe, regime, retraining, notifications, experts, performance, json_safety, risk_controls]
            docstring_style: google
            show_source: false
            show_root_heading: false
            show_signature_annotations: true
            separate_signature: true
            show_if_no_docstring: true
            filters: ["!^_"]
            members_order: alphabetical
            heading_level: 2

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

nav:
  - Home: index.md
  - Getting started:
      - Install: getting-started/install.md
      - Hello world: getting-started/hello-world.md
      - The dashboard: getting-started/dashboard.md
  - Tutorials:
      - Hello world: tutorials/00_hello_world.ipynb
      - Signal evaluation: tutorials/01_signal_evaluation.ipynb
      - Book construction: tutorials/02_book_construction.ipynb
      - Overfitting tests: tutorials/03_overfitting_tests.ipynb
  - Guide:
      - Signals: guide/signals.md
      - Sizing: guide/sizing.md
      - Neutrality: guide/neutrality.md
      - Costs: guide/costs.md
      - Backtesting: guide/backtesting.md
      - Overfitting: guide/overfitting.md
