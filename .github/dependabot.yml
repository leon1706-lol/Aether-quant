# V5.5.0 - weekly dependency PRs, one ecosystem each. The CI jobs
# (dependency-audit, webui npm audit) report advisories; this is what turns
# an advisory into a reviewable bump. tests/test_ci_workflows.py pins the
# four ecosystems so none can be dropped silently. V6.6.6 (#357): the actions
# and the Dockerfiles' base images are pinned by commit and digest; Dependabot
# moves the pins. Base images get digest refreshes only (no Python or Node
# version jump without a deliberate edit).
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/requirements"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
  - package-ecosystem: "npm"
    directory: "/webui"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
