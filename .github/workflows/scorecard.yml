name: Scorecard

# V6.6.5 (#353): the OpenSSF Scorecard of the repository's supply-chain practices (branch protection, pinned actions,
# token permissions, signed releases, ...). Results go to the Security tab and to the public Scorecard API behind the
# README badge; no secret and no account is needed.
on:
  push:
    branches: [main]
  schedule:
    - cron: "41 5 * * 2"
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # v2.4.0 pulls its image from gcr.io, which now refuses the pull; v2.4.1 and later use ghcr.io
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@9418214df1f2c4b8128c770156c409013b07d6b9 # v3.39.3
        with:
          sarif_file: scorecard.sarif
