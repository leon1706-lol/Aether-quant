name: Formal proofs

# The Lean 4 proofs in formal/ (Mathlib from its cache): the build, no `sorry`, the axioms each theorem rests on, and the differential cases regenerated from the specs and compared with the committed
# ones. It needs no secret and writes nothing. `aq prove` was only ever a local step; a proof that did not build, or a case file out of date with its spec, could reach main unseen (V6.6.4).
on:
  push:
    branches: [main]
    paths:
      - "formal/**"
      - "aether_quant/_formal_cases/**"
      - "audit/hash_chain.py"
      - "execution/order_gate.py"
      - "evaluation/generation_registry.py"
      - "evaluation/forward_ledger.py"
      - "evaluation/research_cells.py"
      - "portfolio/generation_blend.py"
      - "risk/kill_switch.py"
      # V6.6.7: every file a spec models (only seven were listed)
      - "json_safety.py"
      - "risk_controls.py"
      - "execution/accounts.py"
      - "execution/cost_model.py"
      - "execution/reconciliation.py"
      - "monitoring/auth.py"
      - "portfolio/book_construction.py"
      - "portfolio/book_neutrality.py"
      - "portfolio/sleeve_guard.py"
      - "risk/position_sizing.py"
      - "risk/rl_sizing.py"
      - "evaluation/generation_ledger.py"
      - "retraining/backtest_gate.py"
      - "retraining/auto_rollback.py"
      - "portfolio/premia_signals.py"
      - "portfolio/target_weights.py"
      - "portfolio/cash_sweep.py"
      - "portfolio/class_sleeve.py"
      - "risk/forex_risk.py"
      - "risk/vol_target.py"
      # V6.6.10
      - "portfolio/book_optimizer.py"
      - "evaluation/multi_asset_round.py"
      - "evaluation/model_book_round.py"
      - "evaluation/premia_research.py"
      - "retraining/slicing.py"
      - "risk/kelly.py"
      - "scripts/check_axioms.py"
      - ".github/workflows/formal.yml"
  pull_request:
    paths:
      - "formal/**"
      - "aether_quant/_formal_cases/**"
  schedule:
    - cron: "11 5 1 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: formal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install the few packages aq needs to run the proof steps
        run: python -m pip install --require-hashes -r requirements/lock/light.txt

      - name: Install Lean (elan)
        run: |
          # V6.6.7 (#361): the installer at a fixed commit, checked by hash, never master
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/9605b24b08cf68b78dce0014b6fa01be1f8e2cee/elan-init.sh -o elan-init.sh
          echo "a620ff1641616222c8d37c54845492004bb84d6877cdbc944dd65c1aa685bf53  elan-init.sh" | sha256sum -c -
          sh elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: No sorry in any spec
        run: python aq_cli.py prove --check-sorry

      - name: Mathlib from its cache, then build every spec
        working-directory: formal
        run: |
          lake exe cache get
          lake build AetherFormal

      - name: Regenerate the differential cases and compare with the committed ones
        run: |
          python aq_cli.py prove --regen-cases
          git diff --exit-code -- aether_quant/_formal_cases

      - name: Which axioms does each theorem rest on
        run: python scripts/check_axioms.py
