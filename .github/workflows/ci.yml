name: CI

# V5.3.9 - deep CI suite: windows+ubuntu pytest matrix with a coverage gate
# (V6.6.6: every tracked module at 100%, pyproject's [tool.coverage]), ruff lint, the full webui
# vitest suite, an offline CLI smoke battery, and workflow self-validation.
# V5.5.0 - guard jobs for the offline/live-parity round: fast-guards,
# subsystem-matrix, wheel-smoke, python-compat, docker-checks, parity-smoke,
# and secret-scan. tests/test_ci_workflows.py pins them all.
# V6.6.6 - the README's test badge is built from this run's JUnit report by pages.yml
# (scripts/test_badge.py), so the old warn-only test-count-drift job is gone.
# V6.2.0 - Linux jobs pin ubuntu-24.04: ubuntu-latest moves to 26.04 from 2026-10-19
# and setup-python's 3.11 builds for a new image can lag; the actions run on Node 24.
on:
  push:
    branches: [main]
  pull_request:

# V5.4.2 - cancel superseded runs on rapid-fire pushes (ported from Aether-Vault)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default (no job writes with the token; CodeQL actions/missing-workflow-permissions).
permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Syntax-check main.py (no Lean runtime available in CI - see development/Problems.md #69)
        run: python -m py_compile main.py

      - name: Install CPU-only PyTorch (Linux runner)
        if: runner.os == 'Linux'
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: |
          pip install -r requirements/requirements.txt -r requirements/requirements-dev.txt
          pip install pytest-cov

      - name: Run full test suite with coverage gate
        run: >
          pytest -m "not lean_backtest" -ra --junitxml=junit.xml
          --cov --cov-report=term-missing --cov-report=xml --cov-report=json --cov-report=html
          --cov-fail-under=100

      # V6.6.5 (#353): the figure in the run summary, and the reports pages.yml publishes with the badge
      - name: Coverage summary
        if: matrix.os == 'ubuntu-24.04'
        run: python scripts/coverage_badge.py coverage.json --label "python coverage" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage artifact
        if: matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-xml
          path: |
            coverage.xml
            coverage.json
            htmlcov/
            junit.xml

  python-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements/requirements-dev.txt

      # V5.3.11 FIX: bare `ruff check .` — NOT `aq test --ruff` (which
      # requires importing aq_cli → pandas via the full package chain, but
      # this job intentionally has a minimal environment). Local devs use
      # `aq test --ruff`; CI uses bare ruff for speed.
      # V5.4.7: ruff is PINNED - the previous unbounded range let new ruff
      # releases add rules and break CI independently of any repo change.
      - name: Install ruff
        run: pip install "ruff==0.16.4"

      - name: Ruff check (E/F ruleset calibrated in pyproject.toml)
        run: ruff check .

      - name: Syntax-check main.py
        run: python -m py_compile main.py

  dependency-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements/requirements.txt

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit runtime dependencies for known CVEs
        run: |
          pip install -r requirements/requirements.txt
          pip-audit --requirement requirements/requirements.txt --desc

      - name: Audit dev dependencies for known CVEs
        run: |
          pip-audit --requirement requirements/requirements-dev.txt --desc

  webui-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: webui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: webui/package-lock.json

      - run: npm ci
      - run: npx tsc -b
      - run: npx oxlint
      # V5.3.9 - the full frontend suite finally runs in CI too.
      # V6.6.5 (#353): with coverage, uploaded beside the Python report
      - run: npx vitest run --pool=threads --coverage
      - run: npm run build
      - name: Upload web UI coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: webui-coverage
          path: webui/coverage/
      # V6.6.5 (#353): blocking. Runtime dependencies only, high and critical; `npm audit fix` cleared the last ones.
      - name: npm audit (runtime deps, high+)
        run: npm audit --omit=dev --audit-level=high

  cli-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements/requirements.txt

      # V5.5.0 - the default Linux torch wheel drags in ~2 GB of CUDA libraries a
      # CPU-only runner never uses. Installing the CPU build FIRST lets the
      # requirements install below see torch as already satisfied.
      - name: Install CPU-only PyTorch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install package editable
        run: |
          pip install -r requirements/requirements.txt
          pip install -e .

      - name: CLI smoke battery (offline, deterministic)
        run: |
          aq --help > /dev/null
          aq evaluate --help > /dev/null
          aq config get phase1.universe.name
          aq secrets-check

  workflows-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # V5.3.10 - single-step pinned install + validate: the previous two-step
      # pattern (PATH append, then bare `actionlint`) failed with
      # "command not found" on the runner. Pinned to v1.7.7 for
      # reproducibility (meta-tested in tests/test_ci_workflows.py).
      - name: Validate workflow files (actionlint v1.7.7)
        run: |
          curl -sSL -o actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -no-color -verbose

  # V5.5.0 - the cheap, high-signal guards, in one place so a PR that breaks
  # test registration, the README flag docs, a workflow, the packaging list,
  # a docs link or a parity fix fails in minutes instead of after the whole
  # coverage matrix. They also run inside python-tests; this is the fast copy.
  fast-guards:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements/requirements-dev.txt

      # V5.5.0 - the default Linux torch wheel drags in ~2 GB of CUDA libraries a
      # CPU-only runner never uses. Installing the CPU build FIRST lets the
      # requirements install below see torch as already satisfied.
      - name: Install CPU-only PyTorch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: pip install -r requirements/requirements.txt -r requirements/requirements-dev.txt

      - name: Guard tests (registration, help surface, workflows, packaging, docs links, parity round)
        run: >
          pytest -q -p no:cacheprovider
          tests/test_cli_help_surface.py
          tests/test_ci_workflows.py
          tests/test_dockerignore_secrets.py
          tests/test_lean_runtime_imports.py
          tests/test_packaging_modules.py
          tests/test_docs_links.py
          tests/test_docs_facts.py
          tests/test_aether_quant_coverage.py
          tests/test_v550_parity_fixes.py
          tests/test_aq_cli.py::test_subsystem_test_files_maps_every_real_test_file_to_exactly_one_bucket

  # V5.5.0 - `aq test --<subsystem>` per bucket: proves every bucket is
  # self-contained (no hidden cross-file ordering) and that the routing in
  # aq_cli.py::_SUBSYSTEM_TEST_FILES works, which the single full-tree run
  # never exercises. The full run above stays the coverage source of truth.
  subsystem-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        subsystem: [cli, audit, risk, portfolio, features, data-pipeline, webui, ml, retraining, notifications, storage, live, evaluation, formal, meta, scripts]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements/requirements-dev.txt

      # V5.5.0 - the default Linux torch wheel drags in ~2 GB of CUDA libraries a
      # CPU-only runner never uses. Installing the CPU build FIRST lets the
      # requirements install below see torch as already satisfied.
      - name: Install CPU-only PyTorch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies and the package
        run: |
          pip install -r requirements/requirements.txt -r requirements/requirements-dev.txt
          pip install -e .

      - name: aq test --${{ matrix.subsystem }}
        run: aq test --${{ matrix.subsystem }}

  # V5.5.0 - builds the real wheel and exercises it OUTSIDE the checkout.
  # `pip install -e .` (cli-smoke) puts the whole repo on sys.path and hides
  # every pyproject.toml packaging gap; this job found four missing packages
  # and a missing root module the first time it ran.
  wheel-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # setuptools-scm needs tags to version the wheel

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements/requirements.txt

      - name: Build the wheel
        run: |
          pip install build
          python -m build --wheel

      - name: Install the wheel into a clean venv (CPU torch first)
        run: |
          python -m venv "$RUNNER_TEMP/aq-wheel"
          "$RUNNER_TEMP/aq-wheel/bin/pip" install --upgrade pip
          "$RUNNER_TEMP/aq-wheel/bin/pip" install torch --index-url https://download.pytorch.org/whl/cpu
          "$RUNNER_TEMP/aq-wheel/bin/pip" install -r requirements/requirements.txt dist/*.whl

      - name: Smoke-test the installed wheel from outside the checkout
        working-directory: ${{ runner.temp }}
        run: '"$RUNNER_TEMP/aq-wheel/bin/python" "$GITHUB_WORKSPACE/scripts/wheel_smoke.py"'

  # V5.5.0 - requires-python is >=3.10 but every other job runs 3.11, so a
  # 3.11-only construct would ship unnoticed. Byte-compiling is syntax-only
  # (cheap, no dependencies); it still catches except*, 3.12 f-strings, etc.
  python-compat:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.10"

      - name: Byte-compile first-party sources on Python 3.10
        run: >
          python -m compileall -q
          -x '(^|/)(\.git|\.venv|venv|node_modules|backtests|webui|Aether-quant-Obsidian-Vault|build|dist|\.matplotlib_cache)(/|$)'
          .

      # Byte-compiling can't see a standard-library name that is new in 3.11 (datetime.UTC, #326). vermin reads what each source needs and fails on anything above 3.10.
      - name: First-party sources need no more than Python 3.10 (vermin)
        run: |
          pip install vermin==1.9.2
          vermin -t=3.10- --no-tips --violations -q aether_quant analyzer audit data_pipeline evaluation execution experience experts features inference liquidity moe monitoring notifications performance portfolio regime retraining risk topology aq_cli.py docs_facts.py json_safety.py performance_probe.py risk_controls.py generate_backtest_report.py generate_evaluation_report.py scripts/cycle_daily.py scripts/forward_ledger.py

  # V5.5.0 - Docker is never built with Lean in CI (the 40 GB base image does
  # not fit a hosted runner), but everything checkable without it is checked.
  docker-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint Dockerfiles (hadolint v2.12.0, errors only)
        run: |
          curl -sSL -o hadolint \
            https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64
          chmod +x hadolint
          ./hadolint --failure-threshold error Dockerfile Dockerfile.lean

      - name: Validate docker-compose.yml (default and lean profile)
        run: |
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.yml --profile lean config -q
          docker compose -f docker-compose.yml --profile dashboard config -q
          mkdir -p secrets && printf 'x' > secrets/postgres_password && printf 'x' > secrets/postgres_dsn
          docker compose -f docker-compose.yml -f docker-compose.secrets.yml config -q

      - name: Build the webui stage of the engine image
        run: docker build --target webui-builder -t aq-webui-check .

      # V6.6.5 (#344): the one-command dashboard, built and answering with its demo data
      - name: Build and smoke-test the dashboard image
        run: |
          docker build --target dashboard -t aq-dashboard-check .
          docker image ls aq-dashboard-check --format '{{.Size}}' >> "$GITHUB_STEP_SUMMARY"
          docker run -d --name aq-dashboard -p 8080:8000 aq-dashboard-check
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/api/health && break; sleep 2; done
          curl -fsS http://127.0.0.1:8080/api/health | grep -q '"demo":true'
          curl -fsS http://127.0.0.1:8080/api/state | grep -q '"mode":"demo"'
          curl -fsS http://127.0.0.1:8080/ | grep -q 'id="root"'
          docker rm -f aq-dashboard

      # V6.6.5 (#353): blocking on critical findings that have a fix, in the source tree and in the published image
      - name: Trivy scan of the source tree
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-dirs: backtests,backtests_invalid,webui/node_modules

      - name: Trivy scan of the dashboard image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: aq-dashboard-check
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  # V5.5.0 - the new parity tooling, run in isolation so a regression in
  # the offline/live-parity measurements is named by the job that failed.
  parity-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements/requirements-dev.txt

      # V5.5.0 - the default Linux torch wheel drags in ~2 GB of CUDA libraries a
      # CPU-only runner never uses. Installing the CPU build FIRST lets the
      # requirements install below see torch as already satisfied.
      - name: Install CPU-only PyTorch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: pip install -r requirements/requirements.txt -r requirements/requirements-dev.txt

      - name: Backtest audit, as-live simulator, calibration and sleeve tests
        run: >
          pytest -q -p no:cacheprovider
          tests/test_backtest_audit.py
          tests/test_live_parity.py
          tests/test_volatility_threshold_calibration.py
          tests/test_legacy_sleeve.py
          tests/test_performance_probe.py
          tests/test_rank_book_simulator.py
          tests/test_feature_parity.py

      - name: Offline parity audit of feature replicas (synthetic, no data files needed)
        run: python scripts/feature_parity_audit.py --synthetic-only

  # V6.6.5 (#353): the working-tree scan is BLOCKING (it has passed on every run since V5.5.0). The history scan stays
  # advisory until its first report is reviewed: a historic dev default may need an allowlist entry, never a rewrite.
  secret-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scan the working tree for secrets (gitleaks v8.18.4)
        run: |
          curl -sSL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --no-git --no-banner --redact --exit-code 1 --config .gitleaks.toml

      - name: Scan the whole git history (advisory until reviewed)
        continue-on-error: true
        run: ./gitleaks detect --source . --no-banner --redact --exit-code 1 --config .gitleaks.toml

  # V6.6.5 (#342): `pip install aether-quant` with no extras is the research install: nothing heavy, and `aq hello` works
  lite-install:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Build the wheel
        run: |
          pip install build
          python -m build --wheel

      - name: Install the wheel with no extras into a clean venv
        run: |
          python -m venv "$RUNNER_TEMP/aq-lite"
          "$RUNNER_TEMP/aq-lite/bin/pip" install dist/*.whl

      - name: Nothing heavy came with it
        run: |
          "$RUNNER_TEMP/aq-lite/bin/pip" list
          for heavy in torch lean ibapi redis psycopg fastapi uvicorn scipy scikit-learn httpx; do
            if "$RUNNER_TEMP/aq-lite/bin/pip" show "$heavy" > /dev/null 2>&1; then echo "::error::$heavy came with the light install"; exit 1; fi
          done

      - name: aq hello --offline and every facade, outside the checkout
        working-directory: ${{ runner.temp }}
        env:
          AQ_SKIP_UPDATE_CHECK: "1"
        run: |
          start=$(date +%s)
          "$RUNNER_TEMP/aq-lite/bin/aq" hello --offline --json hello.json
          "$RUNNER_TEMP/aq-lite/bin/python" -c "import importlib, pkgutil, aether_quant; [importlib.import_module('aether_quant.' + m.name) for m in pkgutil.iter_modules(aether_quant.__path__) if not m.name.startswith('_')]"
          echo "aq hello --offline and the facades: $(( $(date +%s) - start )) s" >> "$GITHUB_STEP_SUMMARY"

  # V6.6.5 (#346): every exported callable fully annotated (the floor only rises); pyright's view of the installed wheel
  typecheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Type completeness of the public API
        run: |
          pip install numpy pandas
          python scripts/type_completeness.py

      - name: pyright --verifytypes on the installed wheel (advisory)
        continue-on-error: true
        run: |
          pip install build "pyright==1.1.409"
          python -m build --wheel
          python -m venv "$RUNNER_TEMP/aq-types"
          "$RUNNER_TEMP/aq-types/bin/pip" install dist/*.whl
          cd "$RUNNER_TEMP"
          VIRTUAL_ENV="$RUNNER_TEMP/aq-types" PATH="$RUNNER_TEMP/aq-types/bin:$PATH" pyright --verifytypes aether_quant --ignoreexternal

  # V6.6.5 (#346): the API docs, built strictly (a broken reference or a stale page fails)
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Build the site
        run: |
          pip install -r requirements/requirements-docs.txt numpy pandas
          python scripts/build_docs.py --check
          python scripts/build_docs.py
          mkdocs build --strict

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-site
          path: site/

  # V6.6.5 (#343): the four tutorials run clean from their sources
  notebooks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Run every notebook
        run: |
          pip install numpy pandas scipy matplotlib nbclient nbformat ipykernel
          python -m ipykernel install --user --name python3
