name: Pages

# V6.6.5 (#346, #353): the documentation site, the HTML coverage reports and the coverage and test badges, published to GitHub
# Pages after CI passes on main (https://leon1706-lol.github.io/Aether-quant/). Reads CI's coverage artifacts; never
# deploys from a pull request or a branch other than main.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # a push to this repository's main only: a fork's pull request from a branch named main also reports head_branch main
    if: >-
      github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'
      && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      # main's head, never the triggering run's commit (Scorecard Dangerous-Workflow, #357); its coverage is used only
      # when CI ran on that same commit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Download CI's coverage reports
        if: github.event_name == 'workflow_run' && github.event.workflow_run.head_sha == github.sha
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: "*coverage*"
          path: coverage-artifacts
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the site, the coverage pages and the badge
        run: |
          pip install -r requirements/requirements-docs.txt numpy pandas
          python scripts/build_docs.py
          mkdocs build --strict
          if [ -f coverage-artifacts/coverage-xml/coverage.json ]; then
            mkdir -p site/coverage
            cp -r coverage-artifacts/coverage-xml/htmlcov/. site/coverage/
            python scripts/coverage_badge.py coverage-artifacts/coverage-xml/coverage.json --badge site/badges/coverage.json
          fi
          if [ -f coverage-artifacts/coverage-xml/junit.xml ]; then
            python scripts/test_badge.py coverage-artifacts/coverage-xml/junit.xml --badge site/badges/tests.json
          fi
          if [ -d coverage-artifacts/webui-coverage/lcov-report ]; then
            mkdir -p site/coverage-webui && cp -r coverage-artifacts/webui-coverage/lcov-report/. site/coverage-webui/
          fi

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site/

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
