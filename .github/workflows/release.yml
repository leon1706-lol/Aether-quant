name: Release

# Releasing is a manual, deliberate act: tag a commit on main and push the
# tag. Nothing else triggers this workflow - matches this project's existing
# bias toward no uncontrolled automatic actions (see e.g. retraining's
# manual promote/rollback).
# V6.6.6 (#356): every release carries its wheel, sdist, SBOM, a Sigstore signature per file and SLSA provenance, so the
# OpenSSF Scorecard sees it (a release with no assets is skipped). A dispatch with `backfill_tag` signs and attaches PyPI's
# own files to a release published before that, and publishes nothing.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      backfill_tag:
        description: "A published tag (vX.Y.Z) whose release lacks signed assets"
        required: true

# Least privilege by default (the publishing jobs raise their own; CodeQL actions/missing-workflow-permissions).
permissions:
  contents: read

jobs:
  # V5.3.9 - NON-BLOCKING visibility job: runs the full offline suite on the
  # tagged commit so release-time gaps are visible right next to the
  # artifacts. Deliberately NOT wired into `needs:` of the publish jobs
  # (user decision): releases proceed regardless; read this job's result to
  # see where the gaps are.
  tag-tests:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements/lock/ci.txt

      - name: Install dependencies (hash-locked, CPU torch)
        run: python -m pip install --require-hashes -r requirements/lock/ci.txt

      - name: Run full offline suite (visibility only - does not gate the release)
        run: pytest -m "not lean_backtest" -ra

  publish-pypi:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    environment: pypi # must match the Environment name configured in PyPI's Trusted Publisher setup
    permissions:
      # Required for PyPI Trusted Publishing (OIDC) - no PyPI token is ever
      # stored as a secret. Requires a one-time Trusted Publisher setup on
      # the PyPI project page (repo + this workflow filename).
      id-token: write
      # V6.6.5 (#353): build provenance for the wheel and sdist
      attestations: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history/tags - required for setuptools-scm

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Build sdist and wheel
        run: |
          python -m pip install --require-hashes -r requirements/lock/tools.txt
          python -m build

      - name: Attest build provenance of the wheel and sdist
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"

      - name: SBOM of the wheel's dependencies (CycloneDX)
        run: |
          python -m venv "$RUNNER_TEMP/sbom"
          "$RUNNER_TEMP/sbom/bin/pip" install --require-hashes -r requirements/lock/sbom.txt
          "$RUNNER_TEMP/sbom/bin/pip" install --no-deps dist/*.whl
          "$RUNNER_TEMP/sbom/bin/cyclonedx-py" environment "$RUNNER_TEMP/sbom" --of JSON -o sbom-wheel.cdx.json

      # signed in a copy: the publish step uploads everything in dist/. V6.6.7 (#365): the provenance is the attestation
      # just made (a Sigstore bundle holding the in-toto SLSA statement), one JSON value per line, as the Scorecard reads it
      - name: Release assets, each signed with Sigstore, and the provenance
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          mkdir release-assets
          cp dist/* sbom-wheel.cdx.json release-assets/
          python -m sigstore sign release-assets/*.whl release-assets/*.tar.gz
          jq -c . "$BUNDLE" > "release-assets/aether_quant-${GITHUB_REF_NAME}.intoto.jsonl"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: release-assets/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  # V6.6.5 (#344, #353): two images from one Dockerfile: the engine (default target) and the light dashboard, each with
  # an SBOM and a provenance attestation.
  publish-docker:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: engine
            image: ghcr.io/leon1706-lol/aether-quant
          - target: dashboard
            image: ghcr.io/leon1706-lol/aether-quant-dashboard
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      # Hardcoded lowercase, not derived from ${{ github.repository }}:
      # the repo is leon1706-lol/Aether-quant (capital A), but Docker image
      # references must be all-lowercase - using github.repository directly
      # would fail with "invalid reference format".
      IMAGE_NAME: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          build-args: AQ_VERSION=${{ github.ref_name }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GitHub Actions cache backend - without this, every release
          # build started cold (no layer reuse across releases) even
          # though the Dockerfile itself is already correctly ordered
          # (deps installed before source COPY, see development/Problems.md).
          # mode=max caches every intermediate layer, not just the final
          # image, so the npm ci/pip install layers survive between runs.
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

      - name: Attest the image's provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: SBOM of the image (CycloneDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ matrix.image }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom-${{ matrix.target }}.cdx.json
          upload-artifact: true
          # on a tag the action would also attach the SBOM to the release, which needs contents: write (v6.6.5 failed there)
          upload-release-assets: false

  # V6.6.10: the example models `aq models install` downloads: trained on the bundled public sample only (never the project's own
  # models, which stay private), zipped with a manifest of their sha256, and signed like the other assets.
  example-models:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install dependencies (hash-locked, CPU torch)
        run: |
          python -m pip install --require-hashes -r requirements/lock/ci.txt
          python -m pip install --require-hashes -r requirements/lock/tools.txt

      - name: Train the example models on the bundled sample and sign them
        run: |
          python scripts/build_example_models.py --out example-models
          python -m sigstore sign example-models/*.zip example-models/example_models_manifest.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: example-models
          path: example-models/

  # Creates the GitHub Release once per tag, with the signed assets. Notes are auto-generated (commit list since the
  # previous tag); the body points at development/Changelog.md, the canonical per-version record.
  github-release:
    if: github.event_name == 'push'
    needs: [publish-pypi, example-models]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release-assets

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: example-models
          path: release-assets

      - name: Create the release with its assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          # a re-run of a tag (a fixed workflow, the tag moved) keeps the release and replaces its assets
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
            exit 0
          fi
          BODY="See [development/Changelog.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/development/Changelog.md) for the full entry for \`V${VERSION}\` and every prior release."
          gh release create "$TAG" release-assets/*             --title "Aether Quant ${TAG}"             --notes "$BODY"             --generate-notes

  # The Scorecard reads releases when it runs; run it on main once the release and its provenance exist.
  scorecard-refresh:
    if: github.event_name == 'push'
    needs: [publish-pypi, github-release]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Dispatch the Scorecard on main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run scorecard.yml --ref main

  # Dispatch only: PyPI's own wheel and sdist for an older tag (digests checked against PyPI), signed and attached, with
  # the provenance recorded when they were built (V6.6.7, #365): the tag build's GitHub attestation, else PyPI's PEP 740
  # publish attestation. Nothing here attests files this run did not build.
  backfill-assets:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      actions: write
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: requirements/lock

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Download, check, sign and attach
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.backfill_tag }}
        run: |
          case "$TAG" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "not a vX.Y.Z tag: $TAG"; exit 1 ;; esac
          gh release view "$TAG" > /dev/null
          mkdir release-assets
          python - "${TAG#v}" <<'EOF'
          import hashlib, json, sys, urllib.request
          version = sys.argv[1]
          with urllib.request.urlopen(f"https://pypi.org/pypi/aether-quant/{version}/json", timeout=60) as response:
              files = json.load(response)["urls"]
          if not files:
              sys.exit(f"PyPI has no files for {version}")
          for entry in files:
              with urllib.request.urlopen(entry["url"], timeout=120) as response:
                  body = response.read()
              if hashlib.sha256(body).hexdigest() != entry["digests"]["sha256"]:
                  sys.exit(f"digest mismatch: {entry['filename']}")
              with open(f"release-assets/{entry['filename']}", "wb") as handle:
                  handle.write(body)
          EOF
          python -m pip install --require-hashes -r requirements/lock/tools.txt
          python -m sigstore sign release-assets/*
          mkdir provenance
          for file in release-assets/*.whl release-assets/*.tar.gz; do
            (cd provenance && gh attestation download "../$file" -R "$GH_REPO") || true
          done
          if ls provenance/*.jsonl > /dev/null 2>&1; then
            cat provenance/*.jsonl > "release-assets/aether_quant-${TAG}.intoto.jsonl"
          else
            python - "${TAG#v}" "release-assets/aether_quant-${TAG}.intoto.jsonl" <<'EOF'
          import json, os, sys, urllib.error, urllib.request
          version, out = sys.argv[1], sys.argv[2]
          lines = []
          for name in sorted(os.listdir("release-assets")):
              if not name.endswith((".whl", ".tar.gz")):
                  continue
              url = f"https://pypi.org/integrity/aether-quant/{version}/{name}/provenance"
              try:
                  with urllib.request.urlopen(url, timeout=60) as response:
                      document = json.load(response)
              except urllib.error.HTTPError:
                  continue
              lines += [json.dumps(item, separators=(",", ":")) for bundle in document.get("attestation_bundles", []) for item in bundle.get("attestations", [])]
          if lines:
              with open(out, "w", encoding="utf-8") as handle:
                  handle.write("\n".join(lines) + "\n")
          else:
              print(f"no provenance recorded for {version}: signatures only")
          EOF
          fi
          gh release upload "$TAG" release-assets/* --clobber
          gh workflow run scorecard.yml --ref main
