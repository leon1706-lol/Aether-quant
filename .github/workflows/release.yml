name: Release

# Releasing is a manual, deliberate act: tag a commit on main and push the
# tag. Nothing else triggers this workflow - matches this project's existing
# bias toward no uncontrolled automatic actions (see e.g. retraining's
# manual promote/rollback).
on:
  push:
    tags: ["v*.*.*"]

jobs:
  publish-pypi:
    runs-on: ubuntu-latest
    environment: pypi # must match the Environment name configured in PyPI's Trusted Publisher setup
    permissions:
      # Required for PyPI Trusted Publishing (OIDC) - no PyPI token is ever
      # stored as a secret. Requires a one-time Trusted Publisher setup on
      # the PyPI project page (repo + this workflow filename).
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history/tags - required for setuptools-scm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # Hardcoded lowercase, not derived from ${{ github.repository }}:
      # the repo is leon1706-lol/Aether-quant (capital A), but Docker image
      # references must be all-lowercase - using github.repository directly
      # would fail with "invalid reference format".
      IMAGE_NAME: ghcr.io/leon1706-lol/aether-quant
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GitHub Actions cache backend - without this, every release
          # build started cold (no layer reuse across releases) even
          # though the Dockerfile itself is already correctly ordered
          # (deps installed before source COPY, see development/Problems.md).
          # mode=max caches every intermediate layer, not just the final
          # image, so the npm ci/pip install layers survive between runs.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Creates the GitHub Release itself, once per tag. Notes are auto-generated
  # (commit list since the previous tag); the body additionally points at the
  # matching development/Changelog.md entry, which is this repo's canonical
  # per-version record (see CONTRIBUTING.md's versioning section).
  github-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Release with changelog link
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          BODY=$(cat <<EOF
          See [development/Changelog.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/development/Changelog.md) for the full entry for \`V${VERSION}\` and every prior release. This repo keeps its changelog as an append-only historical record; each tagged version corresponds to a \`## V<version>\` section there.

          ---
          EOF
          )
          gh release create "$TAG" \
            --title "Aether Quant ${TAG}" \
            --notes "$BODY" \
            --generate-notes
